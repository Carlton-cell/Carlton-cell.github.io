<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e8c86">
  <title>知识竞赛 · 2025级硕士4班</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">

    <!-- 首页 -->
    <section id="view-home" class="view">
      <div class="hero">
        <img src="/assets/banhui-small.png" alt="班徽" class="hero-emblem">
        <div class="hero-badge">知识竞赛进行中</div>
        <h1>湘雅二医院 2025级硕士4班</h1>
        <p class="hero-sub">安全知识 · 党的理论 · 防诈知识</p>
        <p class="motto">班训：风清气正 · 精武强能 · 甘苦与共 · 团结忠诚</p>
      </div>
      <div class="card">
        <label class="field-label" for="nameInput">你的姓名</label>
        <input id="nameInput" class="field-input" type="text" maxlength="20" placeholder="请输入真实姓名" autocomplete="off">
        <button id="startBtn" class="btn btn-primary btn-block">开始答题</button>
        <a href="/leaderboard.html" class="btn btn-ghost btn-block">查看排行榜</a>
      </div>
      <p class="tips">共 25 题 · 全部为单选题 · 提交后即时出分</p>
    </section>

    <!-- 答题页 -->
    <section id="view-quiz" class="view hidden">
      <div class="quiz-header">
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-meta">
          <span id="quizIndex">第 1 / 25 题</span>
          <span id="quizCategory">安全知识</span>
        </div>
      </div>
      <div class="card quiz-card">
        <h2 id="questionText" class="question-text">题目加载中…</h2>
        <div id="optionsWrap" class="options"></div>
      </div>
      <div class="quiz-footer">
        <button id="prevBtn" class="btn btn-ghost">上一题</button>
        <button id="nextBtn" class="btn btn-primary">下一题</button>
      </div>
    </section>

    <!-- 成绩页 -->
    <section id="view-result" class="view hidden">
      <div class="hero">
        <h1>答题完成 🎉</h1>
      </div>
      <div class="card result-card">
        <div class="score-num"><span id="scoreNum">0</span><span class="score-total">/<span id="scoreTotal">25</span></span></div>
        <div class="result-grid">
          <div class="result-item"><span class="result-label">我的排名</span><span class="result-value" id="rankNum">-</span></div>
          <div class="result-item"><span class="result-label">参与人数</span><span class="result-value" id="participantNum">-</span></div>
        </div>
        <a href="/leaderboard.html" class="btn btn-primary btn-block">查看完整排行榜</a>
        <a href="/" id="backHomeBtn" class="btn btn-ghost btn-block">返回官网首页</a>
      </div>
    </section>

  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/js/app.js"></script>
</body>
</html>
